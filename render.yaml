services:
  - type: web
    name: hsa-master-dgnl
    env: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
